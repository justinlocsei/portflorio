name: Run a Portflorio task

on:
  workflow_call:
    inputs:
      task:
        description: The Portflorio task to run
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-task:
    name: Run
    runs-on: ubuntu-24.04
    steps:
      - name: Clone Portflorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/install-node
        name: Install Node.js
        with:
          node-version: 24

      - name: Run portflorio ${{ inputs.task }}
        run: ./bin/portflorio ${{ inputs.task }}
